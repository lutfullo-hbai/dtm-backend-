# Alembic configuration. The database URL is deliberately absent: migrations/env.py
# reads DATABASE_URL through the application's Settings, like the app itself.
# Run as a one-off process (make migrate); the app never migrates at startup.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# 2026_11_20_1430_add_refresh_tokens.py: files sort by creation time (UTC).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
truncate_slug_length = 40

[post_write_hooks]
# Generated revisions are fixed and formatted, so they pass `make lint` unedited.
hooks = ruff_format, ruff_fix
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
